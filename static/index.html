<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPS 전력 모니터</title>
<link rel="stylesheet" href="/common.css">
</head>
<body>

<header>
  <h1>UPS 전력 모니터</h1>
  <span class="chip" id="status-chip">연결 중…</span>
  <span id="updated"></span>
</header>

<nav>
  <a href="/" aria-current="page">전력 사용량</a>
  <a href="/power-quality">공급전원 보고서</a>
</nav>

<div class="tiles">
  <div class="tile hero">
    <div class="label">현재 전력</div>
    <div class="value"><span id="now-w">–</span><small>W</small></div>
  </div>
  <div class="tile">
    <div class="label">UPS 부하</div>
    <div class="value"><span id="now-load">–</span><small>%</small></div>
  </div>
  <div class="tile">
    <div class="label">오늘 사용량</div>
    <div class="value"><span id="today-kwh">–</span><small>kWh</small></div>
  </div>
  <div class="tile">
    <div class="label">이번 달 누적 <span id="month-name"></span></div>
    <div class="value"><span id="month-kwh">–</span><small>kWh</small></div>
  </div>
</div>

<div class="card"><h2>최근 24시간 전력 추이 — 시간별 평균 (W)</h2><div class="chart" id="chart-hourly"></div></div>
<div class="card"><h2>일별 사용량 — 최근 30일 (kWh)</h2><div class="chart" id="chart-daily"></div></div>
<div class="card"><h2>월별 사용량 — 최근 12개월 (kWh)</h2><div class="chart" id="chart-monthly"></div></div>

<footer>전력(W) = 정격 650W × UPS 부하율. apcaccess 샘플의 시간 적분으로 kWh 산출.</footer>

<script src="/common.js"></script>
<script>
"use strict";

async function refreshRealtime() {
  try {
    const d = await fetchJSON("/api/realtime");
    if (d.ts == null) { $("status-chip").textContent = "수집 대기 중"; return; }
    $("now-w").textContent = fmt(d.watts, 1);
    $("now-load").textContent = fmt(d.loadpct, 1);
    const age = Date.now() / 1000 - d.ts;
    $("updated").textContent = age > 120
      ? `⚠ 마지막 샘플 ${Math.round(age / 60)}분 전 — 수집기 확인 필요`
      : `갱신 ${new Date(d.ts * 1000).toLocaleTimeString("ko-KR")}`;
    applyStatus($("status-chip"), d.status);
  } catch (e) {
    $("status-chip").className = "chip crit";
    $("status-chip").textContent = "서버 연결 실패";
  }
}

let cache = { hourly: [], daily: [], monthly: [] };

async function refreshCharts() {
  try {
    const [hourly, daily, monthly, summary] = await Promise.all([
      fetchJSON("/api/hourly?hours=24"), fetchJSON("/api/daily?days=30"),
      fetchJSON("/api/monthly?months=12"), fetchJSON("/api/summary"),
    ]);
    cache = { hourly, daily, monthly };
    $("today-kwh").textContent = fmt(summary.today_kwh, 2);
    $("month-kwh").textContent = fmt(summary.month_kwh, 1);
    $("month-name").textContent = `(${+summary.month.slice(5)}월)`;
    renderAll();
  } catch (e) { /* 다음 주기에 재시도 */ }
}

function renderAll() {
  lineChart($("chart-hourly"), cache.hourly, {
    key: "avg_w", unit: "W", digits: 0,
    tipFn: d => {
      const dt = new Date(d.t * 1000);
      return `${dt.getMonth() + 1}/${dt.getDate()} ${dt.getHours()}시 &nbsp; 평균 <b>${fmt(d.avg_w, 1)} W</b>` +
        `<br>최소 ${fmt(d.min_w, 1)} · 최대 ${fmt(d.max_w, 1)} W · ${fmt(d.kwh * 1000, 0)} Wh`;
    },
  });
  barChart($("chart-daily"), cache.daily,
    d => `${+d.t.slice(5, 7)}/${+d.t.slice(8)}`,
    d => `${d.t} &nbsp; <b>${fmt(d.kwh, 3)} kWh</b><br>평균 ${fmt(d.avg_w, 1)} W · 최소 ${fmt(d.min_w, 1)} · 최대 ${fmt(d.max_w, 1)} W`,
    2);
  const n = new Date();
  const thisMonth = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}`;
  barChart($("chart-monthly"), cache.monthly,
    d => `${+d.t.slice(5)}월`,
    d => `${d.t}${d.t === thisMonth ? " (진행 중)" : ""} &nbsp; <b>${fmt(d.kwh, 2)} kWh</b><br>평균 ${fmt(d.avg_w, 1)} W`,
    0);
}

onResize(renderAll);
refreshRealtime(); refreshCharts();
setInterval(refreshRealtime, 5000);
setInterval(refreshCharts, 60000);
</script>
</body>
</html>
