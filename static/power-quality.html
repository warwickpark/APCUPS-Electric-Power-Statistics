<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공급전원 보고서 — UPS 전력 모니터</title>
<link rel="stylesheet" href="/common.css">
</head>
<body>

<header>
  <h1>공급전원 보고서</h1>
  <span class="chip" id="status-chip">연결 중…</span>
  <span id="updated"></span>
</header>

<nav>
  <a href="/">전력 사용량</a>
  <a href="/power-quality" aria-current="page">공급전원 보고서</a>
</nav>

<div class="tiles">
  <div class="tile hero">
    <div class="label">현재 입력 전압</div>
    <div class="value"><span id="now-v">–</span><small>V</small></div>
    <div class="sub" id="band-sub"></div>
  </div>
  <div class="tile">
    <div class="label">24시간 변동 폭</div>
    <div class="value" style="font-size:22px"><span id="range-v">–</span></div>
    <div class="sub" id="avg-sub"></div>
  </div>
  <div class="tile">
    <div class="label">정상 범위 이탈</div>
    <div class="value"><span id="out-pct">–</span><small>%</small></div>
    <div class="sub" id="out-sub">최근 24시간</div>
  </div>
  <div class="tile">
    <div class="label">배터리 전환 (30일)</div>
    <div class="value"><span id="xfer-count">–</span><small>회</small></div>
    <div class="sub" id="onbatt-sub"></div>
  </div>
</div>

<div class="card">
  <h2>단기 — 최근 24시간 입력 전압 <span class="hint">시간별 최소~최대 범위와 평균</span></h2>
  <div class="chart" id="chart-volt-hourly"></div>
</div>

<div class="card">
  <h2>장기 — 최근 30일 <span class="hint">일별 최소~최대 범위와 평균</span></h2>
  <div class="chart" id="chart-volt-daily"></div>
</div>

<div class="card">
  <h2>장기 — 최근 12개월 <span class="hint">월별 최소~최대 범위와 평균</span></h2>
  <div class="chart" id="chart-volt-monthly"></div>
</div>

<div class="card">
  <h2>변동 폭 추이 <span class="hint">일별 표준편차(σ) — 클수록 전원이 불안정</span></h2>
  <div class="chart" id="chart-sd"></div>
</div>

<div class="card">
  <h2>공급전원 이벤트 <span class="hint">최근 30일</span></h2>
  <div id="events"></div>
</div>

<footer id="note"></footer>

<script src="/common.js"></script>
<script>
"use strict";

let cache = { hourly: [], daily: [], monthly: [], summary: null };

const TAG_CLASS = { sag: "sag", swell: "swell", onbatt: "onbatt", xfer: "xfer", comm: "comm" };

async function refreshRealtime() {
  try {
    const d = await fetchJSON("/api/realtime");
    if (d.ts == null) { $("status-chip").textContent = "수집 대기 중"; return; }
    $("now-v").textContent = d.linev == null ? "–" : fmt(d.linev, 0);
    const age = Date.now() / 1000 - d.ts;
    $("updated").textContent = age > 120
      ? `⚠ 마지막 샘플 ${Math.round(age / 60)}분 전 — 수집기 확인 필요`
      : `갱신 ${new Date(d.ts * 1000).toLocaleTimeString("ko-KR")}`;
    applyStatus($("status-chip"), d.status);
  } catch (e) {
    $("status-chip").className = "chip crit";
    $("status-chip").textContent = "서버 연결 실패";
  }
}

async function refreshAll() {
  try {
    const [hourly, daily, monthly, summary, events] = await Promise.all([
      fetchJSON("/api/voltage/hourly?hours=24"),
      fetchJSON("/api/voltage/daily?days=30"),
      fetchJSON("/api/voltage/monthly?months=12"),
      fetchJSON("/api/voltage/summary?hours=24"),
      fetchJSON("/api/events?days=30"),
    ]);
    cache = { hourly, daily, monthly, summary };
    renderTiles(summary, events);
    renderEvents(events);
    renderCharts();
  } catch (e) { /* 다음 주기에 재시도 */ }
}

function renderTiles(s, events) {
  if (s.nominal_v) {
    $("band-sub").textContent =
      `정상 ${fmt(s.low_v, 0)}~${fmt(s.high_v, 0)}V (기준 ${fmt(s.nominal_v, 0)}V ±${fmt(s.tolerance_pct, 0)}%)`;
  }
  if (s.n) {
    $("range-v").textContent = `${fmt(s.min_v, 0)} ~ ${fmt(s.max_v, 0)} V`;
    $("avg-sub").textContent = `평균 ${fmt(s.avg_v, 1)}V · σ ${fmt(s.sd_v, 2)}V`;
    $("out-pct").textContent = fmt(s.out_pct, 2);
    $("out-sub").textContent = `최근 24시간 · ${s.n_out}/${s.n} 샘플`;
  }
  const xfer = events.filter(e => e.kind === "xfer").length;
  const onbatt = events.filter(e => e.kind === "onbatt");
  const onbattSec = onbatt.reduce((a, e) => a + e.duration, 0);
  $("xfer-count").textContent = xfer + onbatt.length;
  $("onbatt-sub").textContent = onbatt.length
    ? `배터리 구동 ${onbatt.length}회 · 누적 ${durationLabel(onbattSec)}`
    : "배터리 구동 없음";

  const t = [];
  if (s.lotrans && s.hitrans) {
    t.push(`UPS 전환 임계 ${fmt(s.lotrans, 0)}V / ${fmt(s.hitrans, 0)}V (감도 ${s.sense || "?"})`);
  }
  const iv = s.interval >= 1 ? `${fmt(s.interval, 0)}초` : "수집";
  t.push(`${iv} 주기 폴링이라 사이클 단위의 순간 전압강하·스파이크는 직접 관측되지 않는다. ` +
         "그런 사건은 UPS 내부 카운터(NUMXFERS)가 늘어날 때 ‘배터리 전환’ 이벤트로만 기록된다.");
  $("note").innerHTML = t.join("<br>");
}

function renderCharts() {
  const s = cache.summary || {};
  const limits = [
    { v: s.low_v, label: `하한 ${fmt(s.low_v, 0)}V` },
    { v: s.high_v, label: `상한 ${fmt(s.high_v, 0)}V` },
  ];
  bandChart($("chart-volt-hourly"), cache.hourly, { limits, labelFn: hourLabel, labelEvery: 3 });
  bandChart($("chart-volt-daily"), cache.daily, {
    limits, labelFn: t => `${+t.slice(5, 7)}/${+t.slice(8)}`,
  });
  bandChart($("chart-volt-monthly"), cache.monthly, {
    limits, labelFn: t => `${+t.slice(5)}월`,
  });
  lineChart($("chart-sd"), cache.daily, {
    key: "sd_v", unit: "V", digits: 2, zeroBased: false,
    labelEvery: Math.max(1, Math.ceil(cache.daily.length / 10)),
    labelFn: t => `${+t.slice(5, 7)}/${+t.slice(8)}`,
    tipFn: d => `${d.t} &nbsp; σ <b>${fmt(d.sd_v, 2)} V</b><br>평균 ${fmt(d.avg_v, 1)}V · ` +
                `범위 ${fmt(d.min_v, 0)}~${fmt(d.max_v, 0)}V`,
  });
}

function renderEvents(events) {
  const box = $("events");
  if (!events.length) {
    box.innerHTML = '<div class="empty-row">최근 30일 동안 기록된 이벤트가 없습니다</div>';
    return;
  }
  const rows = events.slice(0, 50).map(e => {
    const dur = e.ongoing
      ? '<span class="ongoing">진행 중</span>'
      : (e.duration === 0 ? "순간" : durationLabel(e.duration));
    const detail = (e.detail || "").replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
    return `<tr><td class="when">${stampLabel(e.ts)}</td>` +
           `<td><span class="tag ${TAG_CLASS[e.kind] || ""}">${e.label}</span></td>` +
           `<td class="dur">${dur}</td><td>${detail}</td></tr>`;
  }).join("");
  box.innerHTML = `<table class="events"><thead><tr>` +
    `<th>시각</th><th>종류</th><th>지속</th><th>상세</th></tr></thead><tbody>${rows}</tbody></table>` +
    (events.length > 50 ? `<div class="empty-row">외 ${events.length - 50}건</div>` : "");
}

onResize(renderCharts);
refreshRealtime(); refreshAll();
setInterval(refreshRealtime, 5000);
setInterval(refreshAll, 60000);
</script>
</body>
</html>
